<!-- teacher.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Espace Enseignant</title>

</head>
<body>

<nav>

    <h2>Espace Enseignant</h2>

    <button onclick="logout()">
        Déconnexion
    </button>

</nav>

<div>

    <h3>Modifier mes informations</h3>

    <input type="text" id="teacherName" placeholder="Nom complet">

    <br><br>

    <input type="email" id="teacherEmail" placeholder="Email">

    <br><br>

    <input type="password" id="oldPassword" placeholder="Ancien mot de passe">

    <br><br>

    <input type="password" id="teacherPassword" placeholder="Nouveau mot de passe">

    <br><br>

    <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe">

    <br><br>

    <input type="checkbox" onclick="togglePassword()">
    Afficher les mots de passe

    <br><br>

    <button onclick="saveProfile()">
        Enregistrer
    </button>

</div>

<script src="js/teacher.js"></script>

</body>
</html>
