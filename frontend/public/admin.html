<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAV -->
<nav>
    <h2>Dashboard Admin</h2>

    <button onclick="logout()">
        Déconnexion
    </button>
</nav>

<!-- DASHBOARD -->
<div class="dashboard">

    <!-- FORMULAIRE AJOUT -->
    <div class="form-box">

        <h3>Ajouter Enseignant</h3>

        <input type="text" id="name" placeholder="Nom complet">

        <input type="email" id="teacherEmail" placeholder="Email">

        <button onclick="addTeacher()">
            Ajouter
        </button>

    </div>

    <!-- TABLE -->
    <div class="table-box">

        <h3>Liste des enseignants</h3>

        <table>

            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="teacherList">
                <!-- JS injecte ici -->
            </tbody>

        </table>

    </div>

</div>

<script src="js/admin.js"></script>

</body>
</html>
