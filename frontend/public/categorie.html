<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Catégories</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>

    <h2>Gestion des catégories</h2>

    <button onclick="logout()">
        Déconnexion
    </button>

</nav>

<div class="dashboard">

    <div class="form-box">

        <h2>Ajouter catégorie</h2>

        <form id="categorieForm">

            <label>Nom catégorie</label>

            <input type="text" id="categorieNom">

            <button type="submit">
                Ajouter
            </button>

        </form>

    </div>

    <div class="table-box">

        <h2>Liste catégories</h2>

        <ul id="listeCategories"></ul>

    </div>

</div>

<script src="js/data.js"></script>
<script src="js/logout.js"></script>
<script src="js/categories.js"></script>

</body>
</html>
