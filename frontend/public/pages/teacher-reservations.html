<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes réservations — RéservApp</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">📅</div>
      <div>
        <h1>RéservApp</h1>
        <span>Gestion du matériel</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <p class="nav-section-title">Espace Enseignant</p>
      <a href="teacher-new-reservation.html" class="nav-link">
        <span class="nav-icon">➕</span> Nouvelle demande
      </a>
      <a href="teacher-reservations.html" class="nav-link active">
        <span class="nav-icon">📋</span> Mes réservations
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-avatar">MD</div>
      <div class="user-info">
        <div class="user-name">Marie Dupont</div>
        <div class="user-role">Enseignante</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Mes réservations</span>
      <div class="topbar-actions">
        <a href="teacher-new-reservation.html" class="btn btn-primary btn-sm">
          <span>➕</span> Nouvelle demande
        </a>
      </div>
    </header>

    <div class="page-content">

      <!-- Stats -->
      <div class="stats-grid fade-in-up" id="stats-grid">
        <div class="stat-card">
          <span class="stat-icon">📋</span>
          <span class="stat-label">Total</span>
          <span class="stat-value" id="stat-total">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">🕐</span>
          <span class="stat-label">En attente</span>
          <span class="stat-value" id="stat-pending" style="color:var(--orange);">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">✅</span>
          <span class="stat-label">Validées</span>
          <span class="stat-value" id="stat-validated" style="color:var(--green-600);">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">❌</span>
          <span class="stat-label">Rejetées</span>
          <span class="stat-value" id="stat-rejected" style="color:var(--red);">—</span>
        </div>
      </div>

      <!-- Table -->
      <div class="card fade-in-up" style="animation-delay:.1s;">
        <div class="card-header">
          <span class="card-title">Historique des demandes</span>
          <div class="tabs" id="filter-tabs">
            <button class="tab-btn active" onclick="filterBy('all', this)">Toutes</button>
            <button class="tab-btn" onclick="filterBy('pending', this)">En attente</button>
            <button class="tab-btn" onclick="filterBy('validated', this)">Validées</button>
            <button class="tab-btn" onclick="filterBy('rejected', this)">Rejetées</button>
          </div>
        </div>

        <div id="table-container">
          <div style="padding:40px;text-align:center;color:var(--gray-400);">
            <div class="spinner" style="margin:0 auto 12px;border-top-color:var(--green-500);border-color:var(--gray-200);border-top-color:var(--green-500);"></div>
            Chargement...
          </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination" style="display:none;">
          <button class="page-btn">‹</button>
          <button class="page-btn active">1</button>
          <button class="page-btn">2</button>
          <button class="page-btn">›</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  let allReservations = [];
  let currentFilter = "all";

  async function loadReservations() {
    try {
      allReservations = await API.getReservations({ userId: 1 });
      updateStats();
      renderTable(allReservations);
    } catch (e) {
      document.getElementById("table-container").innerHTML =
        `<div class="alert alert-error" style="margin:20px;">Erreur de chargement.</div>`;
    }
  }

  function updateStats() {
    document.getElementById("stat-total").textContent = allReservations.length;
    document.getElementById("stat-pending").textContent = allReservations.filter(r => r.status === "pending").length;
    document.getElementById("stat-validated").textContent = allReservations.filter(r => r.status === "validated").length;
    document.getElementById("stat-rejected").textContent = allReservations.filter(r => r.status === "rejected").length;
  }

  function filterBy(status, btn) {
    currentFilter = status;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const filtered = status === "all" ? allReservations : allReservations.filter(r => r.status === status);
    renderTable(filtered);
  }

  function renderTable(reservations) {
    const container = document.getElementById("table-container");

    if (reservations.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-title">Aucune réservation trouvée</div>
          <div class="empty-state-text">Vous n'avez pas encore de demande dans cette catégorie.</div>
          <div style="margin-top:20px;">
            <a href="teacher-new-reservation.html" class="btn btn-primary">➕ Faire une demande</a>
          </div>
        </div>`;
      document.getElementById("pagination").style.display = "none";
      return;
    }

    const rows = reservations.map(r => {
      const material = r.material
        ? `${r.material.icon} ${r.material.name}`
        : `<span style="color:var(--gray-400);">— En attente d'attribution</span>`;

      const rejectInfo = r.status === "rejected" && r.rejection_reason
        ? `<div class="tooltip-wrap" style="margin-left:6px;">
             <span style="cursor:help;font-size:.8rem;">💬</span>
             <div class="tooltip-text">${r.rejection_reason}</div>
           </div>`
        : "";

      return `
        <tr>
          <td>
            <div style="font-weight:500;">${formatDate(r.start_date)}</div>
            <div style="font-size:.78rem;color:var(--gray-400);">→ ${formatDate(r.end_date)}</div>
          </td>
          <td>${material}</td>
          <td>
            <div style="display:flex;align-items:center;gap:4px;">
              ${statusBadge(r.status)}${rejectInfo}
            </div>
          </td>
          <td style="color:var(--gray-400);font-size:.82rem;">${formatDate(r.created_at)}</td>
        </tr>`;
    }).join("");

    container.innerHTML = `
      <div class="table-wrap" style="border:none;border-radius:0;">
        <table>
          <thead>
            <tr>
              <th>Période</th>
              <th>Matériel attribué</th>
              <th>Statut</th>
              <th>Soumis le</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;

    document.getElementById("pagination").style.display = reservations.length > 8 ? "flex" : "none";
  }

  loadReservations();
</script>
</body>
</html>
