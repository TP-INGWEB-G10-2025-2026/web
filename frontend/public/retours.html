<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des retours</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>

    <h2>Gestion des retours</h2>

    <button onclick="logout()">
        Déconnexion
    </button>

</nav>

<div class="dashboard">

    <div class="form-box">

        <h2>Enregistrer un retour</h2>

        <form id="retourForm">

            <label>Nom du matériel</label>

            <input type="text" id="materielRetour">

            <label>État après retour</label>

            <select id="etatRetour">

                <option>Bon</option>
                <option>Endommagé</option>
                <option>Défectueux</option>

            </select>

            <button type="submit">
                Valider retour
            </button>

        </form>

    </div>

    <div class="table-box">

        <h2>Historique des retours</h2>

        <ul id="listeRetours"></ul>

    </div>

</div>

<script src="js/data.js"></script>
<script src="js/logout.js"></script>
<script src="js/retours.js"></script>

</body>
</html>
