<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des prêts</title>
</head>
<body>

    <h1>Gestion des prêts</h1>

    <form id="pretForm">

        <label>Nom du matériel</label><br>
        <input type="text" id="materiel"><br><br>

        <label>Utilisateur</label><br>
        <input type="text" id="utilisateur"><br><br>

        <label>Date début</label><br>
        <input type="date" id="dateDebut"><br><br>

        <label>Date retour</label><br>
        <input type="date" id="dateRetour"><br><br>

        <button type="submit">Enregistrer</button>

    </form>

    <h2>Liste des prêts</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Matériel</th>
                <th>Utilisateur</th>
                <th>Date début</th>
                <th>Date retour</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="listePrets"></tbody>
    </table>

    <br>

    <a href="dashboard.html">Retour dashboard</a>

    <script src="js/data.js"></script>
    <script src="js/prets.js"></script>

</body>
</html>
