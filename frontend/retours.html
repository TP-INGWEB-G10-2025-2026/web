<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des retours</title>
</head>
<body>

    <h1>Gestion des retours</h1>

    <form id="retourForm">

        <label>Nom du matériel</label><br>
        <input type="text" id="materielRetour"><br><br>

        <label>État après retour</label><br>
        <select id="etatRetour">
            <option>Bon</option>
            <option>Endommagé</option>
            <option>Défectueux</option>
        </select>

        <br><br>

        <button type="submit">Valider retour</button>

    </form>

    <h2>Historique des retours</h2>

    <ul id="listeRetours"></ul>

    <a href="dashboard.html">Retour dashboard</a>

    <script src="js/data.js"></script>
    <script src="js/retours.js"></script>

</body>
</html>
