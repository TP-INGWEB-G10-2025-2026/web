services:

  

  web:
   image: nginx:latest
   volumes:
     - ./frontend:/var/www
     - ./.docker/nginx/nginx.web.conf:/etc/nginx/nginx.conf:ro
   ports:
     - "80:80"
   environment:
     - NGINX_HOST=localhost


  app:
    image: nginx:latest
    volumes:
      - ./backend/:/var/www
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
     - "8000:80"
    env_file:
     - ./backend/.env
    environment:
      - NGINX_HOST=localhost

  php:
    build:
        context: .
        dockerfile: ./.docker/Dockerfile
    env_file:
     - ./backend/.env
    environment:
      - DB_HOST=mysql
    volumes:
        - ./backend/:/var/www
    working_dir: /var/www

  mysql:
    image: mysql:8.0
    ports:
    - '${DB_PORT:-3306}:3306'
    env_file:
     - ./backend/.env
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      #MYSQL_DATABASE: ${DB_DATABASE}




  redis:
    image: redis:alpine




networks:
  laravel-development:



volumes:
  mysql-data-development:


