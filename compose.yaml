services:

  app:
    build:
      context: .
      dockerfile: ./.docker/Dockerfile

    container_name: laravel_fullstack

    ports:
      - "80:80"

    volumes:
      - ./:/var/www

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0

    container_name: laravel_mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: webtest
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: